services:
  postgres:
    image: postgres:18
    container_name: spicehub-postgres
    environment:
      POSTGRES_DB: spicehub
      POSTGRES_USER: spicehub
      POSTGRES_PASSWORD: spicehub
    ports:
      - "5435:5432"
    volumes:
      - spicehub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicehub -d spicehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: spicehub-redis
    ports:
      - "6382:6379"
    volumes:
      - spicehub_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  spicehub_postgres_data:
  spicehub_redis_data: