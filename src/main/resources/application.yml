spring:
  application:
    name: spicehub-marketplace

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: spicehub
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    secret: ${JWT_SECRET:c3BpY2VodWItZGV2LWp3dC1zZWNyZXQta2V5LTMyYiE=}

  refresh-cookie:
    same-site: Strict

  email-verification:
    code-ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5

  password-reset:
    code-ttl: 10m
    request-cooldown: 1m
    max-attempts: 5

  login-attempts:
    max-attempts: 5
    window: 15m

  registration-attempts:
    max-attempts: 5
    window: 15m

email:
  sender:
    api-key: ${RESEND_API_KEY}
    from: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

server:
  port: ${SERVER_PORT:8080}